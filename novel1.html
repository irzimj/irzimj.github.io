<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>诗集</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: #1a1a1a;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #555;
}
.modal-box::-webkit-scrollbar {
  width: 4px;
}
.modal-box::-webkit-scrollbar-thumb {
  background: #d4b98c55;
}
body {
  background: #121212;
  color: #f5e7d3;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
.back-btn {
  position: fixed;
  left: 16px;
  top: 16px;
  font-size: 16px;
  background: rgba(26,26,26,0.95);
  color: #d4b98c;
  border: 1px solid #d4b98c;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 1001;
  transition: all 0.3s;
  touch-action: manipulation;
}
.back-btn:hover, .back-btn:active {
  background: #333;
  color: #f5e7d3;
}
.back-btn::before {
  content: "←";
  font-size: 18px;
}
.modal-box {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 80px 16px 40px;
  -webkit-overflow-scrolling: touch;
}
.article-content {
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 0;
  width: 92%;
}
.article-content h1 {
  font-size: clamp(2rem, 7vw, 3rem);
  font-weight: 700;
  margin-bottom: 10px;
  color: #f5e7d3;
  line-height: 1.3;
  text-align: center;
  letter-spacing: 2px;
}
.article-content .date {
  color: #8a7d66;
  font-size: clamp(0.875rem, 3vw, 1rem);
  text-align: center;
  margin-bottom: 40px;
  position: relative;
  padding-bottom: 20px;
}
.article-content .date::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #d4b98c, transparent);
}
.article-content .content {
  font-size: clamp(1.05rem, 3.5vw, 1.2rem);
  line-height: 2.2;
  color: #d4b98c;
  white-space: pre-wrap;
  word-wrap: break-word;
  word-break: break-all;
  tab-size: 4;
  letter-spacing: 0.5px;
  text-align: justify;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.article-content .content strong {
  color: #f5e7d3;
}
@media (max-width: 375px) {
  .back-btn {
    padding: 6px 10px;
    font-size: 14px;
  }
  .article-content h1 {
    font-size: 1.8rem;
  }
  .article-content .content {
    line-height: 2;
  }
}
.back-btn {
  user-select: none;
  -webkit-user-select: none;
}
.author-tip {
  cursor: pointer;
  color: #f5e7d3;
  text-decoration: underline dotted #d4b98c;
}
.author-popup {
  position: fixed;
  inset: 0;
  background-color: #000000;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.author-popup.show {
  display: flex;
}
.author-popup-text {
  font-size: clamp(1.1rem,4vw,1.5rem);
  color: #d4b98c;
  text-align: center;
  line-height: 2;
}
</style>
</head>
<body>
<button class="back-btn" onclick="location.href='index.html'"></button>

<div class="author-popup" id="authorPopup">
  <div class="author-popup-text">
耀宇，本名黄天一，一位倾向于自由的神人，去介绍页面了解一下吧！
  </div>
</div>

<div class="modal-box article-content">
  <h1>诗集</h1>
  <div class="date">2026 年 08 月 05 日</div>
  <div class="content">
	《黄昏吟》 <span class="author-tip" onclick="showAuthorTip()">耀宇</span>
君随暮色至，晓别破曦微。
惯见浑闲事，愿君知此机：
蓝瞳堪醉月，共处若霞飞。
然戏如童稚，时亲时远违。
	《风刃魄》 <span class="author-tip" onclick="showAuthorTip()">耀宇</span>
飒逐横川踏霰来，坼影冲岚绝尘霜。
残旗卷雪星欲碎，孤刃裁朔过远山。
独光凝寒现英漠，铁甲犹存流云处。
狂沙蚀骨魄仍在，叱咤寰宇万壑风。
  </div>
</div>

<script>
const popup = document.getElementById('authorPopup');
let timer = null;

function showAuthorTip(){
  popup.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(()=>{
    closeAuthorTip();
  },5000);
}
function closeAuthorTip(){
  clearTimeout(timer);
  popup.classList.remove('show');
}
popup.addEventListener('click', closeAuthorTip);
</script>

</body>
</html>
