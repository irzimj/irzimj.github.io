<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: #1a1a1a;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #555;
}
.modal-box::-webkit-scrollbar {
  width: 4px;
}
.modal-box::-webkit-scrollbar-thumb {
  background: #d4b98c55;
}

body {
  background: #121212;
  color: #f5e7d3;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

.back-btn {
  position: fixed;
  left: 16px;
  top: 16px;
  font-size: 16px;
  background: rgba(26,26,26,0.95);
  color: #d4b98c;
  border: 1px solid #d4b98c;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 1001;
  transition: all 0.3s;
  touch-action: manipulation;
}
.back-btn:hover, .back-btn:active {
  background: #333;
  color: #f5e7d3;
}
.back-btn::before {
  content: "←";
  font-size: 18px;
}

.modal-box {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 80px 16px 40px;
  -webkit-overflow-scrolling: touch;
}

.image-content {
  width: 100%;
  height: 100%;
  background: #121212;
  padding: 20px 16px;
}
.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
  justify-items: center;
  align-items: center;
}
.image-item {
  width: 100%;
}
.modal-thumbnail {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  cursor: zoom-in;
  border: 1px solid #d4b98c33;
  border-radius: 8px;
  transition: all 0.2s ease;
  touch-action: manipulation;
}
.modal-thumbnail:hover {
  border-color: #d4b98c;
  transform: scale(1.02);
}

.image-preview-modal {
  display: none;
  position: fixed;
  z-index: 1002;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.95);
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.image-preview-modal.show {
  display: flex;
}
.preview-image {
  max-width: 90%;
  max-height: 90vh;
  object-fit: contain;
  border: 1px solid #d4b98c;
  border-radius: 8px;
}
.close-preview {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(26,26,26,0.9);
  color: #d4b98c;
  border: 1px solid #d4b98c33;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
}
.close-preview:hover {
  background: rgba(26,26,26,1);
  border-color: #d4b98c;
  color: #f5e7d3;
}

@media (max-width: 375px) {
  .back-btn {
    padding: 6px 10px;
    font-size: 14px;
  }
  .image-grid {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
}
@media (min-width: 768px) and (max-width: 1024px) {
  .image-grid {
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
}

.modal-thumbnail, .back-btn, .close-preview {
  user-select: none;
  -webkit-user-select: none;
}
</style>
</head>

<div class="image-preview-modal" id="imagePreviewModal">
  <span class="close-preview" onclick="closeImagePreview()">×</span>
  <img src="" alt="预览图片" class="preview-image" id="previewImage">
</div>

<script>
function openImagePreview(imageSrc) {
  const previewModal = document.getElementById('imagePreviewModal');
  const previewImage = document.getElementById('previewImage');
  previewImage.src = imageSrc;
  previewModal.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeImagePreview() {
  const previewModal = document.getElementById('imagePreviewModal');
  previewModal.classList.remove('show');
  document.body.style.overflow = 'auto';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeImagePreview();
});
document.getElementById('imagePreviewModal').addEventListener('click', e => {
  if (e.target === document.getElementById('imagePreviewModal')) closeImagePreview();
});
</script>
