<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: #1a1a1a;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #555;
}
.modal-box::-webkit-scrollbar {
  width: 4px;
}
.modal-box::-webkit-scrollbar-thumb {
  background: #d4b98c55;
}
body {
  background: #121212;
  color: #f5e7d3;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
.password-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.password-box{
  background:#1a1a1a;
  border-radius:16px;
  padding:32px 24px;
  width:100%;
  max-width:400px;
  border:1px solid #d4b98c;
  text-align:center;
  box-shadow:0 10px 40px rgba(212,185,140,0.2);
}
.password-box h3{
  font-size:1.375rem;
  margin-bottom:20px;
  color:#f5e7d3;
}
.password-input{
  width:100%;
  padding:14px 16px;
  font-size:18px;
  background:#222;
  color:#f5e7d3;
  border:1px solid #a89470;
  border-radius:8px;
  text-align:center;
  margin-bottom:20px;
  outline:none;
}
.password-input:focus{
  border-color:#d4b98c;
  box-shadow:0 0 0 2px rgba(212,185,140,0.2);
}
.btns{
  display:flex;
  gap:12px;
}
.btn{
  flex:1;
  padding:14px;
  border-radius:8px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.btn-ok{
  background:#d4b98c;
  color:#121212;
  font-weight:600;
}
.btn-cancel{
  background:#222;
  color:#d4b98c;
  border:1px solid #d4b98c33;
}
.error{
  color:#ff8a65;
  font-size:14px;
  margin-top:12px;
  display:none;
}
.error.show{
  display:block;
}
.error-image {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  background: #000;
}
.error-image img {
  width: 100vw;
  height: 100vh;
  object-fit: fill;
}
.wrap-content{
  display:none;
}
.back-btn {
  position: fixed;
  left: 16px;
  top: 16px;
  font-size: 16px;
  background: rgba(26,26,26,0.95);
  color: #d4b98c;
  border: 1px solid #d4b98c;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 1001;
  transition: all 0.3s;
  touch-action: manipulation;
}
.back-btn:hover, .back-btn:active {
  background: #333;
  color: #f5e7d3;
}
.back-btn::before {
  content: "←";
  font-size: 18px;
}
.modal-box {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 80px 16px 40px;
  -webkit-overflow-scrolling: touch;
}
.image-content {
  width: 100%;
  height: 100%;
  background: #121212;
  padding: 20px 16px;
}
.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
  justify-items: center;
  align-items: center;
}
.image-item {
  width: 100%;
}
.modal-thumbnail {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  cursor: zoom-in;
  border: 1px solid #d4b98c33;
  border-radius: 8px;
  transition: all 0.2s ease;
  touch-action: manipulation;
}
.modal-thumbnail:hover {
  border-color: #d4b98c;
  transform: scale(1.02);
}
.image-preview-modal {
  display: none;
  position: fixed;
  z-index: 1002;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.95);
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.image-preview-modal.show {
  display: flex;
}
.preview-image {
  max-width: 90%;
  max-height: 90vh;
  object-fit: contain;
  border: 1px solid #d4b98c;
  border-radius: 8px;
}
.close-preview {
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(26,26,26,0.9);
  color: #d4b98c;
  border: 1px solid #d4b98c33;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
}
.close-preview:hover {
  background: rgba(26,26,26,1);
  border-color: #d4b98c;
  color: #f5e7d3;
}
/* Forever 全屏文字 */
.forever-text{
  position:fixed;
  inset:0;
  z-index:1003;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
}
.forever-text span{
  color:#d4b98c;
  font-size:20vw;
  font-weight:bold;
}
@media (max-width: 375px) {
  .back-btn {
    padding: 6px 10px;
    font-size: 14px;
  }
  .image-grid {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
  .password-box{
    padding:20px 15px;
  }
}
@media (min-width: 768px) and (max-width: 1024px) {
  .image-grid {
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
}
.modal-thumbnail, .back-btn, .close-preview {
  user-select: none;
  -webkit-user-select: none;
}
</style>
</head>

<script>
const CORRECT_SHA256 = "0823cf92b5f39aa38361895ba727bde0b60d579c4c940afdd1d147ee5e2319c3";
const HOME_URL = "index.html";
async function sha256(str){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const pwModal = document.getElementById("pwModal");
const pwInput = document.getElementById("pwInput");
const btnOk = document.getElementById("btnOk");
const btnCancel = document.getElementById("btnCancel");
const errMsg = document.getElementById("errMsg");
const pageContent = document.getElementById("pageContent");
const errorImage = document.getElementById("errorImage");
const foreverText = document.getElementById("foreverText");

btnCancel.onclick = ()=>{
  location.href = HOME_URL;
};
async function doCheck(){
  const val = pwInput.value.trim();
  const hash = await sha256(val);
  if(hash === CORRECT_SHA256){
    pwModal.style.display = "none";
    pageContent.style.display = "block";
  }else{
    errMsg.classList.add("show");
    if(navigator.vibrate) navigator.vibrate(150);
    setTimeout(()=>{
      errorImage.style.display = "flex";
    },1200);
    setTimeout(()=>{
      location.href = HOME_URL;
    },45200);
  }
}
btnOk.onclick = doCheck;
pwInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") doCheck();
});
window.addEventListener("load",()=>{
  pwInput.focus();
});

let isLockForever = false;

function openImagePreview(imageSrc) {
  const previewModal = document.getElementById('imagePreviewModal');
  const previewImage = document.getElementById('previewImage');
  previewImage.src = imageSrc;
  previewModal.classList.add('show');
  document.body.style.overflow = 'hidden';

  // 判断是否是0001.webp
  if(imageSrc === "img/0001.webp"){
    isLockForever = true;
    // 6秒倒计时
    setTimeout(()=>{
      closeImagePreview();
      foreverText.style.display = "flex";
      // 展示Forever文字5秒后自动消失，可自行修改时间
      setTimeout(()=>{
        foreverText.style.display = "none";
      },5000);
      isLockForever = false;
    },6000);
  }else{
    isLockForever = false;
  }
}

function closeImagePreview() {
  if(isLockForever) return; //锁定状态禁止关闭
  const previewModal = document.getElementById('imagePreviewModal');
  previewModal.classList.remove('show');
  document.body.style.overflow = 'auto';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if(!isLockForever){
      closeImagePreview();
    }
  }
});

document.getElementById('imagePreviewModal').addEventListener('click', e => {
  if (e.target === document.getElementById('imagePreviewModal')) {
    if(!isLockForever){
      closeImagePreview();
    }
  }
});
</script>
