<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Tree Hole</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background-color:#000000;
  min-height:100vh;
  padding:60px 12px 40px 12px;
  color:#d4b98c;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
}
.text-wrap{
  font-size:clamp(1.4rem,6vw,2.2rem);
  line-height:2.2;
  text-align:center;
  margin-bottom:32px;
}
.back-btn{
  position:fixed;
  top:16px;
  left:16px;
  background:rgba(26,26,26,0.95);
  color:#d4b98c;
  border:1px solid #d4b98c;
  padding:8px 12px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  transition:all 0.3s;
  z-index:10;
}
.back-btn:hover{
  background:#333;
  color:#f5e7d3;
}
/* 给树洞容器一点宽度限制，不要铺满屏幕 */
.giscus-container{
  max-width:900px;
  margin:0 auto;
}
</style>
</head>
<body>
<button class="back-btn" onclick="history.back()">钻出</button>

<div class="text-wrap">
语言文明，莫谈国事，谨言慎行
</div>

<div class="giscus-container">
<script src="https://giscus.app/client.js"
        data-repo="irzimj/irzimj.github.io"
        data-repo-id="R_kgDOQmQWpw"
        data-mapping="number"
        data-term="2"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="dark"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
</div>

</body>
</html>
